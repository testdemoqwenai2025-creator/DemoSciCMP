<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciCMP — Voice Narrated Research Clips</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0a0a0f;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  max-width:900px;
  margin:0 auto;
  padding:40px 20px;
}

.header{
  text-align:center;
  margin-bottom:50px;
}
.header h1{
  font-size:2rem;
  font-weight:700;
  margin-bottom:8px;
  background:linear-gradient(135deg,#00d4aa,#6366f1);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header p{
  color:#888;
  font-size:1rem;
}

.clips-grid{
  display:grid;
  gap:24px;
}

.clip-card{
  background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:28px;
  transition:all 0.3s ease;
}
.clip-card:hover{
  border-color:rgba(255,255,255,0.2);
  transform:translateY(-2px);
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}
.clip-card.active{
  border-color:#00d4aa;
  box-shadow:0 0 30px rgba(0,212,170,0.15);
}

.clip-header{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:16px;
}
.clip-icon{
  font-size:2.5rem;
}
.clip-info h2{
  font-size:1.3rem;
  font-weight:600;
  margin-bottom:4px;
}
.clip-id{
  font-size:0.85rem;
  color:#666;
  font-family:'SF Mono',Monaco,monospace;
}

.voice-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:20px;
  font-size:0.8rem;
  font-weight:600;
  margin-top:12px;
}
.voice-tag.uk{
  background:rgba(99,102,241,0.15);
  color:#818cf8;
  border:1px solid rgba(99,102,241,0.3);
}
.voice-tag.us{
  background:rgba(245,158,11,0.15);
  color:#fbbf24;
  border:1px solid rgba(245,158,11,0.3);
}
.voice-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  animation:pulse 2s infinite;
}
.voice-tag.uk .voice-dot{background:#818cf8}
.voice-tag.us .voice-dot{background:#fbbf24}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.5}
}

.clip-desc{
  color:#aaa;
  font-size:0.95rem;
  line-height:1.6;
  margin-bottom:20px;
}

.audio-controls{
  display:flex;
  align-items:center;
  gap:16px;
}

.play-btn{
  width:56px;
  height:56px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
  flex-shrink:0;
}
.play-btn.primary{
  background:#00d4aa;
  box-shadow:0 4px 20px rgba(0,212,170,0.4);
}
.play-btn.primary:hover{
  transform:scale(1.08);
  box-shadow:0 6px 28px rgba(0,212,170,0.5);
}
.play-btn.primary svg{fill:#000;width:22px;height:22px;margin-left:3px}
.play-btn.primary.playing svg{margin-left:0}

.progress-wrap{
  flex:1;
}
.progress-bar{
  width:100%;
  height:8px;
  background:rgba(255,255,255,0.1);
  border-radius:4px;
  cursor:pointer;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#00d4aa,#00ff88);
  border-radius:4px;
  width:0%;
  transition:width 0.1s linear;
}
.time-display{
  display:flex;
  justify-content:space-between;
  font-size:0.75rem;
  color:#666;
  margin-top:6px;
  font-family:'SF Mono',Monaco,monospace;
}

.status{
  font-size:0.8rem;
  padding:6px 12px;
  border-radius:6px;
  min-width:80px;
  text-align:center;
}
.status.ready{background:rgba(0,212,170,0.1);color:#00d4aa}
.status.playing{background:rgba(239,68,68,0.1);color:#ef4444;animation:pulse 1s infinite}
.status.error{background:rgba(239,68,68,0.2);color:#ef4444}

.footer{
  text-align:center;
  margin-top:50px;
  padding:30px;
  border-top:1px solid rgba(255,255,255,0.05);
  color:#555;
  font-size:0.85rem;
}

@media(max-width:600px){
  .container{padding:24px 16px}
  .clip-card{padding:20px}
  .clip-header{flex-direction-column;align-items:flex-start}
  .play-btn{width:48px;height:48px}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎙️ SciCMP Portfolio Shorts</h1>
    <p>Research paper clips with native voice narrations — British RP & American accents</p>
  </div>

  <div class="clips-grid" id="clipsGrid"></div>

  <div class="footer">
    Click PLAY on any clip to hear the voice narration<br>
    🇬🇧 British RP (jam) · 🇺🇸 American Standard (kazi)
  </div>
</div>

<audio id="mainAudio" preload="auto" style="display:none"></audio>

<script>
const BASE = '/DemoSciCMP';

// All clips with their voice narrations
const CLIPS = [
  {
    id: 'P12',
    name: 'Helios Tandem Photovoltaics',
    icon: '☀️',
    desc: 'Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration and multi-junction design optimization.',
    voiceType: 'uk',
    voiceLabel: 'British RP',
    artist: 'jam',
    audioUrl: `${BASE}/audio/portfolio-shorts/P12_jam.wav`
  },
  {
    id: 'P-AI',
    name: 'Lattice Forge — AI Materials Discovery',
    icon: '🔬',
    desc: 'AI-accelerated discovery of next-generation lattice materials for quantum computing applications using deep learning models.',
    voiceType: 'us',
    voiceLabel: 'American Standard',
    artist: 'kazi',
    audioUrl: `${BASE}/audio/portfolio-shorts/P-ai-materials_kazi.wav`
  },
  {
    id: 'P11',
    name: 'Carbon Sink Bioengineering',
    icon: '🌿',
    desc: 'Novel carbon capture methodology using bio-engineered microorganisms for industrial emissions reduction at scale.',
    voiceType: 'us',
    voiceLabel: 'American Natural',
    artist: 'douji',
    audioUrl: `${BASE}/audio/portfolio-shorts/P11_douji.wav`
  },
  {
    id: 'P3',
    name: 'Solid State Battery Labs',
    icon: '🔋',
    desc: 'Breakthrough in solid-state electrolyte conductivity enabling next-generation battery performance and safety improvements.',
    voiceType: 'us',
    voiceLabel: 'American Standard',
    artist: 'kazi',
    audioUrl: `${BASE}/audio/portfolio-shorts/P3_kazi.wav`
  },
  {
    id: 'P5',
    name: 'Hydrogen Forge Production',
    icon: '💧',
    desc: 'Green hydrogen production via photocatalytic water splitting at industrial scale feasibility with novel catalyst designs.',
    voiceType: 'uk',
    voiceLabel: 'British RP',
    artist: 'jam',
    audioUrl: `${BASE}/audio/portfolio-shorts/P5_jam.wav`
  },
  {
    id: 'P9',
    name: 'TMD Logic Gates',
    icon: '💻',
    desc: 'Transition metal dichalcogenide logic gates for post-silicon computing architectures with ultra-low power consumption.',
    voiceType: 'uk',
    voiceLabel: 'British RP',
    artist: 'jam',
    audioUrl: `${BASE}/audio/portfolio-shorts/P9_jam.wav`
  },
  {
    id: 'P-CMOS',
    name: 'Atomic Gate CMOS Systems',
    icon: '⚛️',
    desc: 'Sub-2nm CMOS transistor design overcoming quantum tunneling limitations through novel gate architecture.',
    voiceType: 'us',
    voiceLabel: 'American Standard',
    artist: 'kazi',
    audioUrl: `${BASE}/audio/portfolio-shorts/P-cmos-2nm_kazi.wav`
  }
];

let currentClipIndex = -1;
let isPlaying = false;
let progressInterval = null;

const audioEl = document.getElementById('mainAudio');
const grid = document.getElementById('clipsGrid');

// Initialize
function init() {
  renderClips();
  
  audioEl.addEventListener('ended', () => {
    setPlayState(false);
  });
  
  audioEl.addEventListener('timeupdate', updateProgress);
  audioEl.addEventListener('canplaythrough', () => {
    if(currentClipIndex >= 0) updateStatus(currentClipIndex, 'ready');
  });
  audioEl.addEventListener('error', (e) => {
    console.error('Audio error:', e);
    if(currentClipIndex >= 0) updateStatus(currentClipIndex, 'error');
  });
  
  console.log('✅ Voice Narration Player loaded');
  console.log(`📦 ${CLIPS.length} clips available`);
}

function renderClips() {
  grid.innerHTML = CLIPS.map((clip, i) => `
    <div class="clip-card" data-index="${i}" id="card-${i}">
      <div class="clip-header">
        <div class="clip-icon">${clip.icon}</div>
        <div class="clip-info">
          <h2>${clip.name}</h2>
          <span class="clip-id">${clip.id}</span>
        </div>
      </div>
      <p class="clip-desc">${clip.desc}</p>
      <div class="voice-tag ${clip.voiceType}">
        <span class="voice-dot"></span>
        ${clip.voiceType === 'uk' ? '🇬🇧' : '🇺🇸'} ${clip.voiceLabel} · ${clip.artist}
      </div>
      <div class="audio-controls" style="margin-top:18px">
        <button class="play-btn primary" onclick="togglePlayback(${i})" aria-label="Play">
          <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
        </button>
        <div class="progress-wrap">
          <div class="progress-bar" onclick="seekAudio(event, ${i})">
            <div class="progress-fill" id="progress-${i}"></div>
          </div>
          <div class="time-display">
            <span id="time-${i}">0:00</span>
            <span id="dur-${i}">--:--</span>
          </div>
        </div>
        <div class="status ready" id="status-${i}">Ready</div>
      </div>
    </div>
  `).join('');
}

function togglePlayback(index) {
  // If clicking same clip that's playing, pause it
  if(index === currentClipIndex && isPlaying) {
    pauseAudio();
    return;
  }
  
  // If different clip, load new one
  if(index !== currentClipIndex) {
    // Reset previous card
    if(currentClipIndex >= 0) {
      document.querySelector(`#card-${currentClipIndex}`).classList.remove('active');
      const prevBtn = document.querySelector(`#card-${currentClipIndex} .play-btn`);
      prevBtn.classList.remove('playing');
      prevBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>';
    }
    
    currentClipIndex = index;
    const clip = CLIPS[index];
    
    console.log(`🎵 Loading: ${clip.name}`);
    console.log(`   Voice: ${clip.voiceLabel} (${clip.artist})`);
    console.log(`   URL: ${clip.audioUrl}`);
    
    audioEl.src = clip.audioUrl;
    audioEl.load();
    
    // Highlight card
    document.querySelectorAll('.clip-card').forEach(c => c.classList.remove('active'));
    document.getElementById(`card-${index}`).classList.add('active');
  }
  
  // Play
  playAudio();
}

function playAudio() {
  const promise = audioEl.play();
  
  if(promise !== undefined) {
    promise.then(() => {
      setPlayState(true);
      console.log('▶️ Playing:', CLIPS[currentClipIndex].name);
    }).catch(err => {
      console.warn('Autoplay blocked, click button again:', err.name);
    });
  }
}

function pauseAudio() {
  audioEl.pause();
  setPlayState(false);
}

function setPlayState(playing) {
  isPlaying = playing;
  
  if(currentClipIndex < 0) return;
  
  const btn = document.querySelector(`#card-${currentClipIndex} .play-btn`);
  if(playing) {
    btn.classList.add('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
    updateStatus(currentClipIndex, 'playing');
  } else {
    btn.classList.remove('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>';
    updateStatus(currentClipIndex, 'ready');
  }
}

function updateStatus(index, state) {
  const el = document.getElementById(`status-${index}`);
  if(!el) return;
  el.className = `status ${state}`;
  el.textContent = state.charAt(0).toUpperCase() + state.slice(1);
}

function updateProgress() {
  if(currentClipIndex < 0 || !audioEl.duration) return;
  
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  const fill = document.getElementById(`progress-${currentClipIndex}`);
  const timeEl = document.getElementById(`time-${currentClipIndex}`);
  const durEl = document.getElementById(`dur-${currentClipIndex}`);
  
  if(fill) fill.style.width = `${pct}%`;
  if(timeEl) timeEl.textContent = formatTime(audioEl.currentTime);
  if(durEl && audioEl.duration) durEl.textContent = formatTime(audioEl.duration);
}

function seekAudio(e, index) {
  if(index !== currentClipIndex) togglePlayback(index);
  
  const bar = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  
  if(audioEl.duration) {
    audioEl.currentTime = pct * audioEl.duration;
  }
}

function formatTime(s) {
  if(!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// Start
init();
</script>

</body>
</html>
