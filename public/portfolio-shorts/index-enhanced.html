<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciCMP — Voice Narrated Research Clips</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#0f0f1a 100%);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  max-width:960px;
  margin:0 auto;
  padding:40px 24px;
}

.header{
  text-align:center;
  margin-bottom:48px;
  padding:32px;
  background:rgba(255,255,255,0.03);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}
.header h1{
  font-size:2.2rem;
  font-weight:700;
  margin-bottom:12px;
  background:linear-gradient(135deg,#00d4aa 0%,#00ff88 50%,#6366f1 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header p{
  color:#888;
  font-size:1.05rem;
  line-height:1.6;
}
.voice-preview{
  display:flex;
  justify-content:center;
  gap:24px;
  margin-top:24px;
  flex-wrap:wrap;
}
.voice-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:30px;
  font-size:0.9rem;
  font-weight:600;
}
.voice-chip.uk{
  background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(99,102,241,0.1));
  color:#a5b4fc;
  border:1px solid rgba(99,102,241,0.4);
}
.voice-chip.us{
  background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(245,158,11,0.1));
  color:#fcd34d;
  border:1px solid rgba(245,158,11,0.4);
}

.clips-grid{
  display:grid;
  gap:20px;
}

.clip-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  padding:28px 32px;
  transition:all 0.35s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
}
.clip-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;
  transition:opacity 0.3s;
}
.clip-card:hover{
  border-color:rgba(255,255,255,0.2);
  transform:translateY(-4px);
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.clip-card:hover::before{opacity:1}
.clip-card.active{
  border-color:var(--accent);
  box-shadow:0 0 40px rgba(0,212,170,0.12),0 20px 60px rgba(0,0,0,0.3);
}
.clip-card.active::before{opacity:1}

.clip-top{
  display:flex;
  align-items:flex-start;
  gap:20px;
  margin-bottom:16px;
}
.clip-icon{
  font-size:2.8rem;
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  border-radius:16px;
  flex-shrink:0;
}
.clip-content{flex:1}
.clip-title{
  font-size:1.35rem;
  font-weight:650;
  margin-bottom:6px;
  letter-spacing:-0.01em;
}
.clip-meta{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.clip-id{
  font-size:0.8rem;
  color:#555;
  font-family:'SF Mono','Fira Code',monospace;
  background:rgba(255,255,255,0.05);
  padding:4px 10px;
  border-radius:6px;
}

.voice-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 14px;
  border-radius:20px;
  font-size:0.82rem;
  font-weight:600;
  margin-top:14px;
}
.voice-badge.uk{
  background:rgba(99,102,241,0.12);
  color:#818cf8;
  border:1px solid rgba(99,102,241,0.25);
}
.voice-badge.us{
  background:rgba(245,158,11,0.12);
  color:#fbbf24;
  border:1px solid rgba(245,158,11,0.25);
}
.voice-indicator{
  width:10px;height:10px;border-radius:50%;
  animation:pulse 2s infinite;
}
.voice-badge.uk .voice-indicator{background:#818cf8;box-shadow:0 0 10px #818cf8}
.voice-badge.us .voice-indicator{background:#fbbf24;box-shadow:0 0 10px #fbbf24}
.voice-badge.speaking .voice-indicator{animation:speak-pulse 0.5s infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes speak-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.3)}}

.clip-desc{
  color:#999;
  font-size:0.95rem;
  line-height:1.7;
  margin:16px 0 22px;
}

.audio-row{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}

.play-btn{
  width:60px;height:60px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s cubic-bezier(.4,0,.2,1);
  flex-shrink:0;
  position:relative;
}
.play-btn::after{
  content:'';
  position:absolute;
  inset:-4px;
  border-radius:50%;
  background:inherit;
  opacity:0;
  filter:blur(12px);
  z-index:-1;
  transition:opacity 0.3s;
}
.play-btn:hover::after{opacity:0.5}
.play-btn.primary{
  background:linear-gradient(135deg,#00d4aa,#00ff88);
  box-shadow:0 6px 24px rgba(0,212,170,0.4);
}
.play-btn.primary:hover{
  transform:scale(1.1);
  box-shadow:0 8px 32px rgba(0,212,170,0.5);
}
.play-btn.primary svg{fill:#0a0a0f;width:24px;height:24px;margin-left:4px}
.play-btn.primary.playing svg{margin-left:0}
.play-btn.primary.playing{
  background:linear-gradient(135deg,#ef4444,#f87171);
  box-shadow:0 6px 24px rgba(239,68,68,0.4);
}

.progress-section{flex:1;min-width:200px}
.progress-track{
  width:100%;height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:5px;
  cursor:pointer;
  overflow:hidden;
  position:relative;
}
.progress-track:hover{height:12px}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#00d4aa,#00ff88);
  border-radius:5px;
  width:0%;
  transition:width 0.08s linear;
  position:relative;
}
.progress-fill::after{
  content:'';
  position:absolute;
  right:0;top:0;bottom:0;
  width:20px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3));
}
.time-info{
  display:flex;
  justify-content:space-between;
  font-size:0.75rem;
  color:#555;
  margin-top:8px;
  font-family:'SF Mono','Fira Code',monospace;
}

.status-pill{
  font-size:0.78rem;
  padding:8px 16px;
  border-radius:10px;
  min-width:90px;
  text-align:center;
  font-weight:500;
  letter-spacing:0.02em;
}
.status-pill.ready{
  background:rgba(0,212,170,0.1);
  color:#34d399;
  border:1px solid rgba(0,212,170,0.2);
}
.status-pill.speaking{
  background:rgba(239,68,68,0.1);
  color:#f87171;
  border:1px solid rgba(239,68,68,0.2);
  animation:glow-red 1.5s infinite;
}
.status-pill.error{
  background:rgba(239,68,68,0.15);
  color:#ef4444;
  border:1px solid rgba(239,68,68,0.3);
}

@keyframes glow-red{
  0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}
  50%{box-shadow:0 0 12px rgba(239,68,68,0.3)}
}

.footer{
  text-align:center;
  margin-top:56px;
  padding:32px;
  border-top:1px solid rgba(255,255,255,0.06);
  color:#444;
  font-size:0.88rem;
  line-height:1.8;
}
.footer span{color:#666}

:root{
  --accent:#00d4aa;
}

@media(max-width:640px){
  .container{padding:24px 16px}
  .clip-card{padding:22px}
  .clip-top{flex-direction:column}
  .play-btn{width:52px;height:52px}
  .header h1{font-size:1.7rem}
}
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🎙️ SciCMP Portfolio Shorts</h1>
    <p>Research paper clips narrated with <strong>native male voices</strong><br>British RP & American Standard accents via Speech Synthesis</p>
    <div class="voice-preview">
      <div class="voice-chip uk">🇬🇧 British RP — Male</div>
      <div class="voice-chip us">🇺🇸 American Standard — Male</div>
    </div>
  </div>

  <div class="clips-grid" id="clipsGrid"></div>

  <div class="footer">
    <span>Powered by Web Speech API</span> · Native voice synthesis<br>
    Click any <strong style="color:var(--accent)">PLAY</strong> button to hear narration
  </div>
</div>

<script>
// ============================================================
// RESEARCH CLIPS WITH NATIVE MALE VOICE NARRATIONS
// Using SpeechSynthesis API - selects native British/American male voices
// ============================================================

const CLIPS = [
  {
    id: 'P12',
    name: 'Helios Tandem Photovoltaics',
    icon: '☀️',
    desc: 'Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration. This breakthrough combines perovskite-silicon heterojunction designs to surpass theoretical efficiency limits of single-junction cells.',
    voiceType: 'uk',
    voiceLabel: 'British RP — Male',
    lang: 'en-GB',
    gender: 'male'
  },
  {
    id: 'P-AI',
    name: 'Lattice Forge — AI Materials Discovery',
    icon: '🔬',
    desc: 'AI-accelerated discovery of next-generation lattice materials for quantum computing applications. Deep learning models predict stable crystal structures with optimized electronic band properties for qubit coherence.',
    voiceType: 'us',
    voiceLabel: 'American Standard — Male',
    lang: 'en-US',
    gender: 'male'
  },
  {
    id: 'P11',
    name: 'Carbon Sink Bioengineering',
    icon: '🌿',
    desc: 'Novel carbon capture methodology using bio-engineered microorganisms for industrial emissions reduction. Engineered cyanobacteria strains demonstrate forty percent improved CO2 sequestration rates.',
    voiceType: 'us',
    voiceLabel: 'American Natural — Male',
    lang: 'en-US',
    gender: 'male'
  },
  {
    id: 'P3',
    name: 'Solid State Battery Labs',
    icon: '🔋',
    desc: 'Breakthrough in solid-state electrolyte conductivity enabling next-generation battery performance. Ceramic-polymer composite electrolytes achieve ionic conductivity exceeding ten milliSiemens per centimeter at room temperature.',
    voiceType: 'us',
    voiceLabel: 'American Standard — Male',
    lang: 'en-US',
    gender: 'male'
  },
  {
    id: 'P5',
    name: 'Hydrogen Forge Production',
    icon: '💧',
    desc: 'Green hydrogen production via photocatalytic water splitting at industrial scale feasibility. Novel dual-doped graphene photocatalysts achieve solar-to-hydrogen efficiency above eighteen percent under ambient conditions.',
    voiceType: 'uk',
    voiceLabel: 'British RP — Male',
    lang: 'en-GB',
    gender: 'male'
  },
  {
    id: 'P9',
    name: 'TMD Logic Gates',
    icon: '💻',
    desc: 'Transition metal dichalcogenide logic gates for post-silicon computing architectures. Molybdenum disulfide transistors demonstrate sub-threshold swing below sixty millivolts per decade with high on-current ratios.',
    voiceType: 'uk',
    voiceLabel: 'British RP — Male',
    lang: 'en-GB',
    gender: 'male'
  },
  {
    id: 'P-CMOS',
    name: 'Atomic Gate CMOS Systems',
    icon: '⚛️',
    desc: 'Sub-two-nanometer CMOS transistor design overcoming quantum tunneling limitations through novel gate-all-around architecture with work-function-engineered metal electrodes.',
    voiceType: 'us',
    voiceLabel: 'American Standard — Male',
    lang: 'en-US',
    gender: 'male'
  }
];

// State
let currentIndex = -1;
let isSpeaking = false;
let utterance = null;

// DOM
const grid = document.getElementById('clipsGrid');

// ============================================================
// VOICE SELECTION - Find best native male voice
// ============================================================

function getBestVoice(langCode, preferredGender) {
  const voices = speechSynthesis.getVoices();
  
  if (voices.length === 0) return null;
  
  console.log(`🔍 Finding ${preferredGender} voice for ${langCode}`);
  console.log(`   Available voices: ${voices.length}`);
  
  // Priority order for voice selection
  const preferences = [];
  
  if (langCode === 'en-GB') {
    // British male preferences - known good native voices
    preferences.push(
      { regex: /google.*uk.*male/i, score: 100 },
      { regex: /english.*uk.*male/i, score: 95 },
      { regex: /british.*male/i, score: 95 },
      { regex: /daniel|oliver|james|harry|george/i, score: 90 }, // Common British male names
      { regex: /en-GB|en_GB/i, score: 85 },
      { regex: /united.*kingdom/i, score: 80 },
      { regex: /uk/i, score: 75 }
    );
  } else if (langCode === 'en-US') {
    // American male preferences - known good native voices
    preferences.push(
      { regex: /google.*us.*male/i, score: 100 },
      { regex: /english.*us.*male/i, score: 95 },
      { regex: /american.*male/i, score: 95 },
      { regex: /david|michael|chris|ryan|alex/i, score: 90 }, // Common American male names
      { regex: /en-US|en_US/i, score: 85 },
      { regex: /united.*states/i, score: 80 },
      { regex: /us/i, score: 75 }
    );
  }
  
  let bestVoice = null;
  let bestScore = -1;
  
  voices.forEach((voice, i) => {
    const voiceStr = `${voice.name} ${voice.lang} ${voice.service || ''}`.toLowerCase();
    
    // Check language match first
    const langMatch = voice.lang.startsWith(langCode.split('-')[0]);
    if (!langMatch && !voiceStr.includes('en')) return;
    
    let score = 0;
    
    // Check each preference
    preferences.forEach(pref => {
      if (pref.regex.test(voiceStr)) {
        score = Math.max(score, pref.score);
      }
    });
    
    // Bonus for exact language match
    if (voice.lang === langCode) score += 10;
    if (voice.lang.startsWith(langCode)) score += 5;
    
    // Prefer Google/Microsoft/Amazon voices (usually higher quality)
    if (/google|microsoft|amazon|apple/i.test(voice.service || '')) score += 3;
    
    // Log candidate voices
    if (score > 40) {
      console.log(`   Candidate: "${voice.name}" (${voice.lang}) [${voice.service||'native'}] score=${score}`);
    }
    
    if (score > bestScore) {
      bestScore = score;
      bestVoice = voice;
    }
  });
  
  // Fallback: just get first matching language voice
  if (!bestVoice) {
    bestVoice = voices.find(v => v.lang.startsWith(langCode)) 
              || voices.find(v => v.lang.startsWith('en'))
              || voices[0];
    console.log(`   Using fallback: "${bestVoice?.name}"`);
  } else {
    console.log(`   ✓ Selected: "${bestVoice.name}" (${bestVoice.lang}) [score=${bestScore}]`);
  }
  
  return bestVoice;
}

// ============================================================
// RENDER CLIPS
// ============================================================

function renderClips() {
  grid.innerHTML = CLIPS.map((clip, i) => `
    <div class="clip-card" data-index="${i}" id="card-${i}">
      <div class="clip-top">
        <div class="clip-icon">${clip.icon}</div>
        <div class="clip-content">
          <h2 class="clip-title">${clip.name}</h2>
          <div class="clip-meta">
            <span class="clip-id">${clip.id}</span>
          </div>
        </div>
      </div>
      <p class="clip-desc">${clip.desc}</p>
      <div class="voice-badge ${clip.voiceType}" id="vbadge-${i}">
        <span class="voice-indicator"></span>
        ${clip.voiceType === 'uk' ? '🇬🇧' : '🇺🇸'} ${clip.voiceLabel}
      </div>
      <div class="audio-row">
        <button class="play-btn primary" onclick="toggleSpeech(${i})" aria-label="Play narration">
          <svg viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"/></svg>
        </button>
        <div class="progress-section">
          <div class="progress-track" onclick="seekNarration(event, ${i})">
            <div class="progress-fill" id="prog-${i}"></div>
          </div>
          <div class="time-info">
            <span id="time-${i}">Ready</span>
            <span id="dur-${i}">--:--</span>
          </div>
        </div>
        <div class="status-pill ready" id="stat-${i}">Ready</div>
      </div>
    </div>
  `).join('');
}

// ============================================================
// SPEECH SYNTHESIS CONTROL
// ============================================================

function toggleSpeech(index) {
  // If clicking same speaking card, stop it
  if (index === currentIndex && isSpeaking) {
    stopSpeaking();
    return;
  }
  
  // Stop any current speech
  stopSpeaking();
  
  currentIndex = index;
  const clip = CLIPS[index];
  
  // Update UI
  updateCardActive(index);
  
  // Create new utterance
  utterance = new SpeechSynthesisUtterance(clip.desc);
  
  // Get best voice for this clip's language
  const voice = getBestVoice(clip.lang, clip.gender);
  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  } else {
    utterance.lang = clip.lang;
  }
  
  // Configure for natural male speech
  utterance.rate = 0.92;       // Slightly slower for clarity
  utterance.pitch = 0.95;      // Lower pitch for male voice
  utterance.volume = 1.0;
  
  // Track timing
  let startTime = null;
  let estimatedDuration = estimateDuration(clip.desc);
  
  utterance.onstart = () => {
    startTime = Date.now();
    isSpeaking = true;
    setSpeakingState(true, index);
    document.getElementById(`dur-${index}`).textContent = formatTime(estimatedDuration);
    startProgressSimulation(index, estimatedDuration);
    console.log(`▶️ Speaking: ${clip.name}`);
    console.log(`   Voice: ${utterance.voice?.name || 'default'} (${utterance.lang})`);
  };
  
  utterance.onend = () => {
    isSpeaking = false;
    setSpeakingState(false, index);
    completeProgress(index);
    console.log(`✅ Finished: ${clip.name}`);
  };
  
  utterance.onerror = (e) => {
    console.error('❌ Speech error:', e);
    isSpeaking = false;
    setSpeakingState(false, index);
    showError(index, e.error || 'Speech failed');
  };
  
  // Speak!
  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  if (currentIndex >= 0) {
    setSpeakingState(false, currentIndex);
    completeProgress(currentIndex);
  }
  isSpeaking = false;
}

function setSpeakingState(speaking, index) {
  const btn = document.querySelector(`#card-${index} .play-btn`);
  const badge = document.getElementById(`vbadge-${index}`);
  const stat = document.getElementById(`stat-${index}`);
  
  if (speaking) {
    btn.classList.add('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
    badge.classList.add('speaking');
    stat.className = 'status-pill speaking';
    stat.textContent = 'Speaking...';
  } else {
    btn.classList.remove('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"/></svg>';
    badge.classList.remove('speaking');
    stat.className = 'status-pill ready';
    stat.textContent = 'Ready';
  }
}

function updateCardActive(index) {
  document.querySelectorAll('.clip-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`card-${index}`).classList.add('active');
}

// ============================================================
// PROGRESS SIMULATION (SpeechSynthesis doesn't expose currentTime)
// ============================================================

let progressInterval = null;

function startProgressSimulation(index, duration) {
  stopProgressSimulation();
  
  const startTime = Date.now();
  const fill = document.getElementById(`prog-${index}`);
  const timeEl = document.getElementById(`time-${index}`);
  
  progressInterval = setInterval(() => {
    if (!isSpeaking) return;
    
    const elapsed = (Date.now() - startTime) / 1000;
    const pct = Math.min(100, (elapsed / duration) * 100);
    
    fill.style.width = `${pct}%`;
    timeEl.textContent = formatTime(elapsed);
    
  }, 100);
}

function stopProgressSimulation() {
  if (progressInterval) {
    clearInterval(progressInterval);
    progressInterval = null;
  }
}

function completeProgress(index) {
  stopProgressSimulation();
  const fill = document.getElementById(`prog-${index}`);
  const timeEl = document.getElementById(`time-${index}`);
  if (fill) fill.style.width = '100%';
  if (timeEl) timeEl.textContent = 'Done';
}

function seekNarration(e, index) {
  // Speech synthesis doesn't support seeking, but we can restart
  if (index !== currentIndex) toggleSpeech(index);
}

// ============================================================
// UTILITIES
// ============================================================

function estimateDuration(text) {
  // Average speaking rate: ~150 words per minute
  const words = text.split(/\s+/).length;
  return (words / 150) * 60; // seconds
}

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function showError(index, msg) {
  const stat = document.getElementById(`stat-${index}`);
  stat.className = 'status-pill error';
  stat.textContent = 'Error';
  console.error(`Error on card ${index}:`, msg);
}

// ============================================================
// INITIALIZATION
// ============================================================

function init() {
  renderClips();
  
  // Load voices (may be async)
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => {
      console.log('🎤 Voices loaded:', speechSynthesis.getVoices().length);
      logAvailableVoices();
    };
  }
  
  // Initial log
  console.log('🎙️ SciCMP Voice Narration Player Initialized');
  console.log(`📦 ${CLIPS.length} research clips ready`);
  
  // Try to log voices immediately if already loaded
  if (speechSynthesis.getVoices().length > 0) {
    logAvailableVoices();
  }
}

function logAvailableVoices() {
  const voices = speechSynthesis.getVoices();
  const enVoices = voices.filter(v => v.lang.startsWith('en'));
  console.log(`\n📋 Available English voices (${enVoices.length}):`);
  enVoices.slice(0, 10).forEach(v => {
    console.log(`   • "${v.name}" (${v.lang}) [${v.service||'system'}]`);
  });
  if (enVoices.length > 10) {
    console.log(`   ... and ${enVoices.length - 10} more`);
  }
}

// Start when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Cancel speech when page hidden (prevents issues)
document.addEventListener('visibilitychange', () => {
  if (document.hidden && isSpeaking) {
    // Keep speaking but note it
    console.log('📱 Page hidden, speech continues...');
  }
});

// Cleanup on unload
window.addEventListener('beforeunload', () => {
  speechSynthesis.cancel();
});
</script>

</body>
