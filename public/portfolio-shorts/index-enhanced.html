<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Portfolio Shorts — SciCMP</title>
<style>
  :root {
    --hud: #ffffff;
    --hud-dim: rgba(255,255,255,0.45);
    --rec: #ff3b30;
    --accent: #00d4aa;
    --voice-uk: #6366f1;
    --voice-us: #f59e0b;
    --mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: var(--mono);
    color: var(--hud);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ========== VIEWFINDER CONTAINER ========== */
  .viewfinder {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }

  /* ========== VIDEO STAGE ========== */
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .clip-visual {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    transition: all 0.8s cubic-bezier(.2,.8,.2,1);
    opacity: 1;
  }

  .clip-visual.changing {
    opacity: 0;
    transform: scale(0.95);
  }

  /* Animated background per clip */
  .bg-helios {
    background: radial-gradient(ellipse at 30% 20%, rgba(255,200,50,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(255,150,0,0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a12 0%, #12121f 100%);
  }

  .bg-lattice {
    background: radial-gradient(ellipse at 70% 30%, rgba(99,102,241,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 70%, rgba(139,92,246,0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0812 0%, #10101f 100%);
  }

  /* Paper icon animation */
  .paper-icon {
    font-size: 80px;
    margin-bottom: 32px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 40px currentColor);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  .clip-title {
    font-family: var(--sans);
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .clip-subtitle {
    font-family: var(--sans);
    font-size: clamp(14px, 2vw, 18px);
    color: var(--hud-dim);
    max-width: 600px;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  /* Voice indicator */
  .voice-indicator {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    font-size: 13px;
  }

  .voice-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  .voice-dot.uk { background: var(--voice-uk); box-shadow: 0 0 12px var(--voice-uk); }
  .voice-dot.us { background: var(--voice-us); box-shadow: 0 0 12px var(--voice-us); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }

  /* Playing state animation */
  .voice-dot.playing {
    animation: pulse-fast 0.4s infinite;
  }

  @keyframes pulse-fast {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.5); }
  }

  /* ========== HUD OVERLAY ========== */
  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    color: var(--hud);
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  .hud-pad {
    position: absolute;
    inset: 24px 32px;
  }

  /* Frame corners */
  .frame-corner {
    position: absolute;
    width: 48px;
    height: 48px;
    border: 1.5px solid var(--hud);
    opacity: 0.6;
  }
  .fc-tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .fc-tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .fc-bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .fc-br { bottom: 0; right: 0; border-left: none; border-top: none; }

  /* Top bar */
  .top-bar {
    position: absolute;
    top: 8px;
    left: 72px;
    right: 72px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .top-left, .top-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .badge {
    padding: 4px 10px;
    border: 1px solid var(--hud);
    border-radius: 4px;
    font-size: 11px;
    letter-spacing: 0.08em;
  }

  .badge-accent {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* REC button */
  .rec-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1.5px solid var(--hud);
    color: var(--hud);
    padding: 4px 12px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    pointer-events: auto;
    transition: all 0.2s ease;
  }

  .rec-btn:hover { background: rgba(255,255,255,0.1); }

  .rec-dot {
    width: 8px;
    height: 8px;
    background: var(--rec);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,59,48,0.7);
  }

  .rec-btn.playing .rec-dot {
    animation: blink 1s steps(2, end) infinite;
  }

  @keyframes blink { 50% { opacity: 0.2; } }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 8px;
    left: 72px;
    right: 72px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .bottom-left, .bottom-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .timecode {
    font-size: 22px;
    letter-spacing: 0.15em;
    font-variant-numeric: tabular-nums;
  }

  .label {
    font-size: 10px;
    color: var(--hud-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  /* Center reticle */
  .reticle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    transform: translate(-50%, -50%);
    opacity: 0.3;
  }

  .reticle-bracket {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: var(--hud);
    border-style: solid;
  }

  .rb-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .rb-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
  .rb-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
  .rb-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

  /* ========== WAVEFORM (Bottom Center) ========== */
  .waveform-container {
    position: absolute;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 15;
    pointer-events: auto;
  }

  .play-btn-large {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(0,212,170,0.4);
  }

  .play-btn-large:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 30px rgba(0,212,170,0.5);
  }

  .play-btn-large:active { transform: scale(0.95); }

  .play-btn-large svg {
    width: 22px;
    height: 22px;
    fill: #000;
    margin-left: 3px;
  }

  .play-btn-large.playing svg { margin-left: 0; }

  .waveform-bars {
    display: flex;
    align-items: center;
    gap: 3px;
    width: 300px;
    height: 44px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 0 12px;
  }

  .wf-bar {
    flex: 1;
    background: var(--hud-dim);
    border-radius: 2px;
    min-height: 6px;
    transition: all 0.1s ease;
  }

  .wf-bar.active {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(0,212,170,0.5);
  }

  .time-display {
    font-size: 14px;
    min-width: 90px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ========== CLIP NAVIGATION (Side) ========== */
  .clip-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 15;
    pointer-events: auto;
  }

  .clip-nav.left { left: 20px; }
  .clip-nav.right { right: 20px; }

  .nav-btn {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: var(--hud-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.25s ease;
  }

  .nav-btn:hover {
    background: rgba(0,212,170,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Clip indicators */
  .clip-indicators {
    position: absolute;
    bottom: 160px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 15;
  }

  .clip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--hud-dim);
    cursor: pointer;
    transition: all 0.3s ease;
    pointer-events: auto;
  }

  .clip-dot:hover { transform: scale(1.3); }
  .clip-dot.active {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transform: scale(1.2);
  }

  /* ========== GRAIN EFFECT ========== */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.03) 0px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: 0.6;
  }

  /* ========== HELP TOOLTIP ========== */
  .help {
    position: absolute;
    left: 50%;
    bottom: 220px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 50;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--hud-dim);
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.5s ease;
    white-space: nowrap;
  }

  .help.show { opacity: 1; }

  .help kbd {
    display: inline-block;
    padding: 2px 6px;
    border: 1px solid var(--hud-dim);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10px;
    margin: 0 3px;
  }

  /* ========== LOADING ========== */
  .loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .loading.show { opacity: 1; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--hud-dim);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--hud-dim);
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 700px) {
    .top-bar, .bottom-bar { left: 50px; right: 50px; font-size: 11px; }
    .timecode { font-size: 18px; }
    .frame-corner { width: 36px; height: 36px; }
    .waveform-container { bottom: 70px; }
    .waveform-bars { width: 180px; }
    .clip-icon { font-size: 60px; }
    .clip-title { font-size: 24px; }
    .nav-btn { width: 32px; height: 32px; }
  }
</style>
</head>
<body>

<div class="viewfinder" id="viewfinder">

  <!-- Main Stage -->
  <div class="stage">
    <div class="clip-visual bg-helios" id="clipVisual">
      <div class="paper-icon" id="paperIcon">☀️</div>
      <h1 class="clip-title" id="clipTitle">Helios Tandem</h1>
      <p class="clip-subtitle" id="clipSubtitle">Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration.</p>
      <div class="voice-indicator" id="voiceIndicator">
        <span class="voice-dot uk" id="voiceDot"></span>
        <span id="voiceLabel">British RP · jam</span>
      </div>
    </div>
  </div>

  <!-- Film Grain -->
  <div class="grain"></div>

  <!-- HUD Overlay -->
  <div class="hud">
    <div class="hud-pad">
      
      <!-- Frame Corners -->
      <div class="frame-corner fc-tl"></div>
      <div class="frame-corner fc-tr"></div>
      <div class="frame-corner fc-bl"></div>
      <div class="frame-corner fc-br"></div>

      <!-- Top Bar -->
      <div class="top-bar">
        <div class="top-left">
          <span class="badge badge-accent">SciCMP</span>
          <span id="clipIdBadge">P12</span>
        </div>
        <div class="top-right">
          <button class="rec-btn" id="recBtn" aria-label="Play/Pause">
            <span class="rec-dot"></span>
            <span id="recLabel">PLAY</span>
          </button>
        </div>
      </div>

      <!-- Reticle -->
      <div class="reticle">
        <div class="reticle-bracket rb-tl"></div>
        <div class="reticle-bracket rb-tr"></div>
        <div class="reticle-bracket rb-bl"></div>
        <div class="reticle-bracket rb-br"></div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="bottom-left">
          <div class="stack"><span id="filterName">HELIOS</span><span class="label">CLIP</span></div>
        </div>
        <div class="stack">
          <span class="timecode" id="timecode">00:00:00</span>
          <span class="label" id="durationLabel">DURATION</span>
        </div>
        <div class="bottom-right">
          <div class="stack"><span id="voiceName">UK</span><span class="label">VOICE</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Waveform Controls -->
  <div class="waveform-container">
    <button class="play-btn-large" id="mainPlayBtn" aria-label="Play narration">
      <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
    </button>
    <div class="waveform-bars" id="waveform"></div>
    <div class="time-display"><span id="currentTime">0:00</span> / <span id="totalTime">0:45</span></div>
  </div>

  <!-- Clip Navigation Dots -->
  <div class="clip-indicators" id="clipIndicators"></div>

  <!-- Side Navigation -->
  <div class="clip-nav left">
    <button class="nav-btn" id="prevBtn" aria-label="Previous clip">←</button>
  </div>
  <div class="clip-nav right">
    <button class="nav-btn" id="nextBtn" aria-label="Next clip">→</button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">LOADING AUDIO</div>
  </div>

  <!-- Help Tooltip -->
  <div class="help" id="help">
    <kbd>←</kbd><kbd>→</kbd> Switch Clips &nbsp;|&nbsp; <kbd>Space</kbd> Play/Pause &nbsp;|&nbsp; <kbd>F</kbd> Fullscreen
  </div>

</div>

<!-- Audio Player -->
<audio id="audioPlayer" preload="auto"></audio>

<script>
// ============================================================
// RESEARCH CLIPS DATA WITH VOICE NARRATIONS
// ============================================================

const clips = [
  {
    id: 'P12',
    name: 'Helios Tandem',
    subtitle: 'Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration.',
    icon: '☀️',
    bgClass: 'bg-helios',
    voice: 'jam',
    voiceType: 'uk',
    voiceLabel: 'British RP · jam',
    file: './audio/portfolio-shorts/P12_jam.wav',
    duration: '0:45',
    filterName: 'HELIOS'
  },
  {
    id: 'P-AI',
    name: 'Lattice Forge',
    subtitle: 'AI-accelerated discovery of next-generation lattice materials for quantum computing applications.',
    icon: '🔬',
    bgClass: 'bg-lattice',
    voice: 'kazi',
    voiceType: 'us',
    voiceLabel: 'American Standard · kazi',
    file: './audio/portfolio-shorts/P-ai-materials_kazi.wav',
    duration: '0:52',
    filterName: 'LATTICE'
  }
];

let currentIndex = 0;
let isPlaying = false;

// ============================================================
// DOM ELEMENTS
// ============================================================

const $ = id => document.getElementById(id);

const audioPlayer = $('audioPlayer');
const clipVisual = $('clipVisual');
const paperIcon = $('paperIcon');
const clipTitle = $('clipTitle');
const clipSubtitle = $('clipSubtitle');
const voiceIndicator = $('voiceIndicator');
const voiceDot = $('voiceDot');
const voiceLabel = $('voiceLabel');
const clipIdBadge = $('clipIdBadge');
const recBtn = $('recBtn');
const recLabel = $('recLabel');
const mainPlayBtn = $('mainPlayBtn');
const waveformEl = $('waveform');
const timecodeEl = $('timecode');
const currentTimeEl = $('currentTime');
const totalTimeEl = ('totalTime');
const filterNameEl = $('filterName');
const voiceNameEl = $('voiceName');
const durationLabelEl = ('durationLabel');
const loadingEl = $('loading');
const helpEl = $('help');
const clipIndicatorsEl = $('clipIndicators');

// ============================================================
// INITIALIZE WAVEFORM
// ============================================================

function initWaveform() {
  waveformEl.innerHTML = '';
  const barCount = 40;
  for (let i = 0; i < barCount; i++) {
    const bar = document.createElement('div');
    bar.className = 'wf-bar';
    bar.style.height = `${Math.random() * 70 + 30}%`;
    waveformEl.appendChild(bar);
  }
}

function initClipIndicators() {
  clipIndicatorsEl.innerHTML = '';
  clips.forEach((_, idx) => {
    const dot = document.createElement('div');
    dot.className = `clip-dot${idx === currentIndex ? ' active' : ''}`;
    dot.addEventListener('click', () => switchClip(idx));
    clipIndicatorsEl.appendChild(dot);
  });
}

// ============================================================
// SWITCH CLIP
// ============================================================

async function switchClip(index) {
  if (index < 0 || index >= clips.length) return;
  
  // Animate out
  clipVisual.classList.add('changing');
  
  await new Promise(r => setTimeout(r, 400));
  
  currentIndex = index;
  const clip = clips[index];
  
  // Update content
  paperIcon.textContent = clip.icon;
  clipTitle.textContent = clip.name;
  clipSubtitle.textContent = clip.subtitle;
  voiceDot.className = `voice-dot ${clip.voiceType}`;
  voiceLabel.textContent = clip.voiceLabel;
  clipIdBadge.textContent = clip.id;
  filterNameEl.textContent = clip.filterName;
  voiceNameEl.textContent = clip.voiceType.toUpperCase();
  totalTimeEl.textContent = clip.duration;
  
  // Update background
  clipVisual.className = `clip-visual ${clip.bgClass}`;
  
  // Update indicators
  document.querySelectorAll('.clip-dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
  
  // Animate in
  setTimeout(() => clipVisual.classList.remove('changing'), 50);
  
  // Load audio
  loadAudio(clip.file);
}

async function loadAudio(src) {
  loadingEl.classList.add('show');
  stopPlayback();
  
  try {
    audioPlayer.src = src;
    await audioPlayer.load();
    
    audioPlayer.addEventListener('loadeddata', () => {
      loadingEl.classList.remove('show');
      totalTimeEl.textContent = formatTime(audioPlayer.duration);
    }, { once: true });
    
  } catch (err) {
    console.error('Audio load error:', err);
    loadingEl.classList.remove('show');
  }
}

// ============================================================
// PLAYBACK CONTROLS
// ============================================================

function togglePlay() {
  if (!audioPlayer.src) return;
  
  if (isPlaying) {
    audioPlayer.pause();
  } else {
    audioPlayer.play().catch(console.error);
  }
}

function startPlayback() {
  isPlaying = true;
  updatePlayButtons();
  animateWaveform(true);
  voiceDot.classList.add('playing');
}

function stopPlayback() {
  isPlaying = false;
  updatePlayButtons();
  animateWaveform(false);
  voiceDot.classList.remove('playing');
}

function updatePlayButtons() {
  // Main play button
  mainPlayBtn.classList.toggle('playing', isPlaying);
  mainPlayBtn.innerHTML = isPlaying
    ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
    : '<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>';
  
  // REC button
  recBtn.classList.toggle('playing', isPlaying);
  recLabel.textContent = isPlaying ? 'REC' : 'PLAY';
}

function animateWaveform(active) {
  const bars = waveformEl.querySelectorAll('.wf-bar');
  bars.forEach((bar, i) => {
    if (active) {
      bar.classList.add('active');
      // Animate heights
      setInterval(() => {
        if (isPlaying) {
          bar.style.height = `${Math.random() * 70 + 30}%`;
        }
      }, 150 + i * 10);
    } else {
      bar.classList.remove('active');
    }
  });
}

// ============================================================
// TIME FORMATTING
// ============================================================

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateTimecode() {
  if (isPlaying && audioPlayer.currentTime) {
    currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
    
    // Update timecode display (more detailed)
    const totalSecs = Math.floor(audioPlayer.currentTime);
    const hh = Math.floor(totalSecs / 3600).toString().padStart(2, '0');
    const mm = Math.floor((totalSecs % 3600) / 60).toString().padStart(2, '0');
    const ss = (totalSecs % 60).toString().padStart(2, '0');
    timecodeEl.textContent = `${hh}:${mm}:${ss}`;
  }
  requestAnimationFrame(updateTimecode);
}

// ============================================================
// EVENT LISTENERS
// ============================================================

mainPlayBtn.addEventListener('click', togglePlay);
recBtn.addEventListener('click', togglePlay);

$('prevBtn').addEventListener('click', () => switchClip(currentIndex - 1));
$('nextBtn').addEventListener('click', () => switchClip(currentIndex + 1));

audioPlayer.addEventListener('play', startPlayback);
audioPlayer.addEventListener('pause', stopPlayback);
audioPlayer.addEventListener('ended', () => {
  stopPlayback();
  // Auto advance to next clip
  if (currentIndex < clips.length - 1) {
    switchClip(currentIndex + 1);
  }
});

audioPlayer.addEventListener('error', () => {
  loadingEl.classList.remove('show');
  console.error('Audio playback error');
});

// Keyboard controls
document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      switchClip(currentIndex - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      switchClip(currentIndex + 1);
      break;
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'f':
    case 'F':
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
      break;
  }
});

// ============================================================
// INITIALIZATION
// ============================================================

initWaveform();
initClipIndicators();
updateTimecode();

// Load first clip
switchClip(0);

// Show help tooltip briefly
setTimeout(() => helpEl.classList.add('show'), 1000);
setTimeout(() => helpEl.classList.remove('show'), 5000);

</script>
</body>
</html>
