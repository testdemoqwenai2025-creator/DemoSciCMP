<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Portfolio Shorts — SciCMP</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: rgba(18, 18, 28, 0.9);
    --border: rgba(255,255,255,0.1);
    --text: #e8e8ed;
    --text-dim: rgba(232,232,237,0.5);
    --accent: #00d4aa;
    --accent-dim: rgba(0,212,170,0.15);
    --rec: #ff3b30;
    --voice-uk: #6366f1;
    --voice-us: #f59e0b;
    --mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: var(--sans);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ========== Main Container ========== */
  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========== Header ========== */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 16px 24px;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  
  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #00a080);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  
  .header-meta {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* ========== Hero / Player Section ========== */
  .player-section {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    max-height: 70vh;
    background: #000;
    overflow: hidden;
  }

  .video-container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
  }

  /* Placeholder visual for research paper */
  .paper-visual {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    transition: opacity 0.5s ease;
  }

  .paper-icon {
    width: 120px;
    height: 120px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    margin-bottom: 24px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .paper-title-main {
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
    max-width: 600px;
  }

  .paper-subtitle {
    font-size: 14px;
    color: var(--text-dim);
    max-width: 500px;
    line-height: 1.6;
  }

  /* Voice indicator badge */
  .voice-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    font-family: var(--mono);
    z-index: 10;
  }

  .voice-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .voice-dot.uk { background: var(--voice-uk); }
  .voice-dot.us { background: var(--voice-us); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }

  /* Audio waveform visualization */
  .waveform-container {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    padding: 16px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .play-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.25s ease;
  }

  .play-btn:hover { transform: scale(1.08); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { width: 20px; height: 20px; fill: #000; margin-left: 2px; }
  .play-btn.playing svg { margin-left: 0; }

  .waveform-bars {
    flex: 1;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .bar {
    flex: 1;
    background: var(--text-dim);
    border-radius: 2px;
    min-height: 4px;
    transition: background 0.15s ease;
  }

  .bar.active { background: var(--accent); }

  .time-display {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    min-width: 80px;
    text-align: right;
  }

  /* ========== Content Section ========== */
  .content-section {
    padding: 32px 24px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    font-family: var(--mono);
  }

  /* ========== Research Papers Grid ========== */
  .papers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }

  .paper-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .paper-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .paper-card:hover {
    border-color: rgba(0,212,170,0.3);
    transform: translateY(-4px);
  }

  .paper-card:hover::before { opacity: 1; }
  .paper-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 40px rgba(0,212,170,0.15);
  }

  .paper-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .paper-id {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 6px;
    font-weight: 600;
  }

  .voice-tag {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .voice-tag.uk { background: rgba(99,102,241,0.15); color: var(--voice-uk); }
  .voice-tag.us { background: rgba(245,158,11,0.15); color: var(--voice-us); }

  .paper-name {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .paper-desc {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .paper-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .status-dot.ready { background: var(--accent); }
  .status-dot.pending { background: #f59e0b; }
  .status-dot.missing { background: #ef4444; }

  /* ========== Info Panel (when playing) ========== */
  .info-panel {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    z-index: 200;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    max-width: 90vw;
    width: 500px;
  }

  .info-panel.show { transform: translateX(-50%) translateY(0); }

  .info-close {
    position: absolute;
    top: 8px;
    right: 12px;
    width: 28px;
    height: 28px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .info-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  .now-playing-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .now-playing-title {
    font-size: 16px;
    font-weight: 600;
  }

  .mini-waveform {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 24px;
  }

  .mini-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    animation: wave 0.5s ease-in-out infinite alternate;
  }

  @keyframes wave {
    from { height: 4px; }
    to { height: 20px; }
  }

  /* ========== Loading State ========== */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,15,0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .loading-overlay.show { opacity: 1; pointer-events: auto; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* ========== Responsive ========== */
  @media (max-width: 768px) {
    .header { padding: 12px 16px; }
    .content-section { padding: 24px 16px; }
    .papers-grid { grid-template-columns: 1fr; }
    .paper-card { padding: 20px; }
    .info-panel {
      flex-direction: column;
      padding: 16px 20px;
      width: calc(100vw - 32px);
      bottom: 16px;
    }
    .waveform-container { padding: 12px 16px; height: 70px; }
    .play-btn { width: 42px; height: 42px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">S</div>
      <span>SciCMP Research</span>
    </div>
    <div class="header-meta">Portfolio Shorts · Voice Narrated</div>
  </header>

  <!-- Main Player Section -->
  <section class="player-section" id="playerSection">
    <div class="video-container">
      
      <!-- Paper Visual Display -->
      <div class="paper-visual" id="paperVisual">
        <div class="paper-icon" id="paperIcon">📄</div>
        <h1 class="paper-title-main" id="paperTitleMain">Select a Research Paper</h1>
        <p class="paper-subtitle" id="paperSubtitle">Choose from the portfolio below to hear voice narration by UK/US native speakers</p>
      </div>

      <!-- Voice Badge -->
      <div class="voice-badge" id="voiceBadge" style="display: none;">
        <span class="voice-dot" id="voiceDot"></span>
        <span id="voiceLabel">British RP</span>
      </div>

      <!-- Waveform & Controls -->
      <div class="waveform-container">
        <button class="play-btn" id="mainPlayBtn" aria-label="Play narration">
          <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
        </button>
        <div class="waveform-bars" id="waveform"></div>
        <div class="time-display"><span id="currentTime">0:00</span> / <span id="totalTime">0:00</span></div>
      </div>

      <!-- Loading Overlay -->
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Loading audio...</div>
      </div>
    </div>
  </section>

  <!-- Content Section -->
  <main class="content-section">
    <div class="section-label">Research Portfolio Shorts</div>
    
    <div class="papers-grid" id="papersGrid">
      <!-- Cards generated by JS -->
    </div>
  </main>

  <!-- Now Playing Info Panel -->
  <div class="info-panel" id="infoPanel">
    <button class="info-close" id="infoClose">&times;</button>
    <div>
      <div class="now-playing-label">Now Playing</div>
      <div class="now-playing-title" id="nowPlayingTitle">-</div>
    </div>
    <div class="mini-waveform" id="miniWaveform">
      <!-- Animated bars -->
    </div>
  </div>

</div>

<!-- Hidden Audio Element -->
<audio id="audioPlayer" preload="auto"></audio>

<script>
// ============================================================
// RESEARCH PORTFOLIO DATA WITH VOICE NARRATIONS
// ============================================================

const researchPapers = [
  {
    id: 'P12',
    name: 'Helios Tandem',
    description: 'Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration.',
    icon: '☀️',
    voice: 'jam',
    voiceType: 'uk',
    voiceLabel: 'British RP (jam)',
    file: 'P12_jam.wav',
    hasAudio: true,
    duration: '~45s'
  },
  {
    id: 'P-ai-materials',
    name: 'Lattice Forge',
    description: 'AI-accelerated discovery of next-generation lattice materials for quantum computing applications.',
    icon: '🔬',
    voice: 'kazi',
    voiceType: 'us',
    voiceLabel: 'American Standard (kazi)',
    file: 'P-ai-materials_kazi.wav',
    hasAudio: true,
    duration: '~52s'
  },
  {
    id: 'P11',
    name: 'Carbon Sink',
    description: 'Novel carbon capture methodology using bio-engineered microorganisms for industrial emissions reduction.',
    icon: '🌿',
    voice: 'douji',
    voiceType: 'us',
    voiceLabel: 'American Natural (douji)',
    file: 'P11_douji.wav',
    hasAudio: true,
    duration: '~38s'
  },
  {
    id: 'P3',
    name: 'Solid State Labs',
    description: 'Breakthrough in solid-state electrolyte conductivity enabling next-gen battery performance.',
    icon: '🔋',
    voice: 'douji',
    voiceType: 'us',
    voiceLabel: 'American Natural (douji)',
    file: null,
    hasAudio: false,
    duration: 'Pending'
  },
  {
    id: 'P5',
    name: 'Hydrogen Forge',
    description: 'Green hydrogen production via photocatalytic water splitting at industrial scale feasibility.',
    icon: '💧',
    voice: 'jam',
    voiceType: 'uk',
    voiceLabel: 'British RP (jam)',
    file: null,
    hasAudio: false,
    duration: 'Pending'
  },
  {
    id: 'P9',
    name: 'TMD Logic',
    description: 'Transition metal dichalcogenide logic gates for post-silicon computing architectures.',
    icon: '💻',
    voice: 'kazi',
    voiceType: 'us',
    voiceLabel: 'American Standard (kazi)',
    file: null,
    hasAudio: false,
    duration: 'Pending'
  },
  {
    id: 'P-cmos-2nm',
    name: 'Atomic Gate Systems',
    description: 'Sub-2nm CMOS transistor design overcoming quantum tunneling limitations.',
    icon: '⚛️',
    voice: 'jam',
    voiceType: 'uk',
    voiceLabel: 'British RP (jam)',
    file: null,
    hasAudio: false,
    duration: 'Pending'
  }
];

// Base URL for audio files
const AUDIO_BASE = './audio/portfolio-shorts/';

// ============================================================
// DOM ELEMENTS
// ============================================================

const $ = id => document.getElementById(id);

const audioPlayer = $('audioPlayer');
const mainPlayBtn = $('mainPlayBtn');
const waveformEl = $('waveform');
const currentTimeEl = $('currentTime');
const totalTimeEl = ('totalTime');
const papersGrid = $('papersGrid');
const paperVisual = $('paperVisual');
const paperIcon = $('paperIcon');
const paperTitleMain = $('paperTitleMain');
const paperSubtitle = $('paperSubtitle');
const voiceBadge = $('voiceBadge');
const voiceDot = $('voiceDot');
const voiceLabel = $('voiceLabel');
const loadingOverlay = $('loadingOverlay');
const infoPanel = $('infoPanel');
const nowPlayingTitle = $('nowPlayingTitle');
const miniWaveform = $('miniWaveform');

let currentPaper = null;
let isPlaying = false;

// ============================================================
// INITIALIZE WAVEFORM BARS
// ============================================================

function initWaveform() {
  waveformEl.innerHTML = '';
  const barCount = 60;
  for (let i = 0; i < barCount; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = `${Math.random() * 80 + 20}%`;
    waveformEl.appendChild(bar);
  }
}

// Initialize mini waveform bars
function initMiniWaveform() {
  miniWaveform.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const bar = document.createElement('div');
    bar.className = 'mini-bar';
    bar.style.animationDelay = `${i * 0.05}s`;
    miniWaveform.appendChild(bar);
  }
}

// ============================================================
// RENDER PAPER CARDS
// ============================================================

function renderPapers() {
  papersGrid.innerHTML = '';
  
  researchPapers.forEach((paper, idx) => {
    const card = document.createElement('div');
    card.className = `paper-card${currentPaper && currentPaper.id === paper.id ? ' active' : ''}`;
    card.dataset.index = idx;
    
    card.innerHTML = `
      <div class="paper-header">
        <span class="paper-id">${paper.id}</span>
        <span class="voice-tag ${paper.voiceType}">
          <span class="voice-dot ${paper.voiceType}"></span>
          ${paper.voice.toUpperCase()}
        </span>
      </div>
      <h3 class="paper-name">${paper.name}</h3>
      <p class="paper-desc">${paper.description}</p>
      <div class="paper-status">
        <span class="status-dot ${paper.hasAudio ? 'ready' : 'missing'}"></span>
        <span>${paper.hasAudio ? `Audio ready · ${paper.duration}` : 'Audio pending'}</span>
      </div>
    `;
    
    card.addEventListener('click', () => selectPaper(idx));
    papersGrid.appendChild(card);
  });
}

// ============================================================
// SELECT & PLAY PAPER
// ============================================================

async function selectPaper(index) {
  const paper = researchPapers[index];
  if (!paper) return;
  
  currentPaper = paper;
  
  // Update visual display
  paperIcon.textContent = paper.icon;
  paperTitleMain.textContent = paper.name;
  paperSubtitle.textContent = paper.description;
  
  // Update voice badge
  voiceBadge.style.display = 'flex';
  voiceDot.className = `voice-dot ${paper.voiceType}`;
  voiceLabel.textContent = paper.voiceLabel;
  
  // Update active state on cards
  document.querySelectorAll('.paper-card').forEach((c, i) => {
    c.classList.toggle('active', i === index);
  });
  
  // Load and play audio if available
  if (paper.hasAudio && paper.file) {
    await loadAndPlay(paper.file);
  } else {
    // Show pending state
    audioPlayer.src = '';
    isPlaying = false;
    updatePlayButton();
    showInfoPanel(false);
  }
}

async function loadAndPlay(filename) {
  loadingOverlay.classList.add('show');
  
  try {
    const audioUrl = AUDIO_BASE + filename;
    audioPlayer.src = audioUrl;
    await audioPlayer.load();
    
    // Update total time when metadata loads
    audioPlayer.addEventListener('loadedmetadata', () => {
      totalTimeEl.textContent = formatTime(audioPlayer.duration);
    }, { once: true });
    
    // Auto-play after load
    await audioPlayer.play();
    isPlaying = true;
    updatePlayButton();
    showInfoPanel(true);
    
  } catch (error) {
    console.error('Error loading audio:', error);
    paperSubtitle.textContent = 'Error loading audio. Please try again.';
  } finally {
    loadingOverlay.classList.remove('show');
  }
}

// ============================================================
// PLAYBACK CONTROLS
// ============================================================

function togglePlay() {
  if (!currentPaper || !currentPaper.hasAudio) return;
  
  if (isPlaying) {
    audioPlayer.pause();
  } else {
    audioPlayer.play();
  }
  
  isPlaying = !isPlaying;
  updatePlayButton();
  showInfoPanel(isPlaying);
}

function updatePlayButton() {
  mainPlayBtn.classList.toggle('playing', isPlaying);
  mainPlayBtn.innerHTML = isPlaying 
    ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
    : '<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>';
}

function showInfoPanel(show) {
  infoPanel.classList.toggle('show', show);
  if (show && currentPaper) {
    nowPlayingTitle.textContent = currentPaper.name;
  }
}

// ============================================================
// TIME FORMATTING
// ============================================================

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

// ============================================================
// ANIMATE WAVEFORM DURING PLAYBACK
// ============================================================

function animateWaveform() {
  const bars = waveformEl.querySelectorAll('.bar');
  bars.forEach((bar, i) => {
    if (isPlaying) {
      bar.classList.add('active');
      bar.style.height = `${Math.random() * 80 + 20}%`;
    } else {
      bar.classList.remove('active');
    }
  });
  
  requestAnimationFrame(() => setTimeout(animateWaveform, 100));
}

// ============================================================
// EVENT LISTENERS
// ============================================================

mainPlayBtn.addEventListener('click', togglePlay);

$('infoClose').addEventListener('click', () => showInfoPanel(false));

audioPlayer.addEventListener('timeupdate', () => {
  currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
});

audioPlayer.addEventListener('ended', () => {
  isPlaying = false;
  updatePlayButton();
  showInfoPanel(false);
});

audioPlayer.addEventListener('error', () => {
  loadingOverlay.classList.remove('show');
  console.error('Audio playback error');
});

// Keyboard controls
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  }
  if (e.key >= '1' && e.key <= '7') {
    const idx = parseInt(e.key) - 1;
    if (researchPapers[idx]) selectPaper(idx);
  }
});

// ============================================================
// INITIALIZE
// ============================================================

initWaveform();
initMiniWaveform();
renderPapers();
animateWaveform();

// Auto-select first available audio paper
const firstWithAudio = researchPapers.findIndex(p => p.hasAudio);
if (firstWithAudio >= 0) {
  selectPaper(firstWithAudio);
}

</script>
