<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Portfolio Shorts — SciCMP</title>
<style>
  :root {
    --hud: #ffffff;
    --hud-dim: rgba(255,255,255,0.6);
    --accent: #00d4aa;
    --voice-uk: #6366f1;
    --voice-us: #f59e0b;
    --mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: var(--mono);
    color: var(--hud);
  }

  .app {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ========== MAIN DISPLAY ========== */
  .display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    transition: opacity 0.4s ease, background 0.6s ease;
  }

  .display.helios { background: radial-gradient(ellipse at 30% 30%, rgba(255,180,50,0.15) 0%, transparent 60%), #0a0a12; }
  .display.lattice { background: radial-gradient(ellipse at 70% 30%, rgba(99,102,241,0.15) 0%, transparent 60%), #08081a; }
  .display.carbon { background: radial-gradient(ellipse at 50% 70%, rgba(16,185,129,0.15) 0%, transparent 60%), #0a120e; }
  .display.solid { background: radial-gradient(ellipse at 60% 40%, rgba(245,158,11,0.15) 0%, transparent 60%), #120e08; }
  .display.hydrogen { background: radial-gradient(ellipse at 40% 60%, rgba(56,189,248,0.15) 0%, transparent 60%), #080e14; }
  .display.tmd { background: radial-gradient(ellipse at 50% 50%, rgba(236,72,153,0.15) 0%, transparent 60%), #140810; }
  .display.atomic { background: radial-gradient(ellipse at 70% 60%, rgba(139,92,246,0.15) 0%, transparent 60%), #0c0814; }

  .icon {
    font-size: 80px;
    margin-bottom: 24px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .title {
    font-family: var(--sans);
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-family: var(--sans);
    font-size: clamp(14px, 2vw, 17px);
    color: var(--hud-dim);
    max-width: 580px;
    line-height: 1.65;
    margin-bottom: 32px;
  }

  /* Voice Badge - Shows accent type clearly */
  .voice-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.uk { background: var(--voice-uk); box-shadow: 0 0 14px var(--voice-uk); }
  .dot.us { background: var(--voice-us); box-shadow: 0 0 14px var(--voice-us); }
  .dot.playing { animation: pulse 0.8s infinite; }

  @keyframes pulse { 
    0%, 100% { opacity: 1; transform: scale(1); } 
    50% { opacity: 0.5; transform: scale(0.9); } 
  }

  .voice-accent {
    font-weight: 600;
  }
  .voice-uk-text { color: var(--voice-uk); }
  .voice-us-text { color: var(--voice-us); }

  /* ========== CONTROLS BAR ========== */
  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 32px 32px;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 20;
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(0,212,170,0.5);
  }

  .play-btn:hover { transform: scale(1.08); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { width: 22px; height: 22px; fill: #000; margin-left: 3px; }
  .play-btn.playing svg { margin-left: 0; }

  .progress-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s linear;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--hud-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ========== HUD ELEMENTS ========== */
  .hud-top {
    position: absolute;
    top: 20px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    font-size: 12px;
  }

  .badge {
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
  }

  .status-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    color: var(--hud);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    transition: all 0.2s;
  }

  .status-btn:hover { background: rgba(255,255,255,0.1); }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .status-dot.active { 
    background: #ff3b30; 
    animation: pulse 1s infinite; 
  }

  /* ========== CLIP NAVIGATION ========== */
  .nav-left, .nav-right {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
  }

  .nav-left { left: 20px; }
  .nav-right { right: 20px; }

  .nav-btn {
    width: 44px;
    height: 44px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    color: var(--hud-dim);
    cursor: pointer;
    font-size: 20px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-btn:hover { 
    background: rgba(0,212,170,0.2); 
    border-color: var(--accent); 
    color: var(--accent); 
  }

  /* ========== CLIP DOTS ========== */
  .clip-dots {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
  }

  .clip-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.3s;
    border: none;
  }

  .clip-dot:hover { transform: scale(1.4); background: rgba(255,255,255,0.5); }
  .clip-dot.active { 
    background: var(--accent); 
    box-shadow: 0 0 14px var(--accent);
    transform: scale(1.25);
  }

  /* ========== NOW PLAYING BAR ========== */
  .now-playing {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    opacity: 0;
    background: rgba(18,18,28,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
    transition: all 0.4s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }

  .now-playing.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  .np-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--hud-dim);
  }

  .np-title {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
  }

  .np-voice {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 500;
  }
  .np-voice.uk { background: rgba(99,102,241,0.2); color: var(--voice-uk); }
  .np-voice.us { background: rgba(245,158,11,0.2); color: var(--voice-us); }

  /* ========== LOADING ========== */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    transition: opacity 0.4s;
  }

  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { 
    font-size: 12px; 
    color: var(--hud-dim); 
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* ========== ERROR STATE ========== */
  .error-msg {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(220,38,38,0.9);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 300;
    display: none;
  }

  .error-msg.show { display: block; animation: shake 0.4s; }

  @keyframes shake {
    0%, 100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% + 8px)); }
    75% { transform: translateX(calc(-50% - 8px)); }
  }

  /* ========== HELP TIP ========== */
  .help-tip {
    position: absolute;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--hud-dim);
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.6s;
    white-space: nowrap;
  }

  .help-tip.show { opacity: 1; }

  .help-tip kbd {
    display: inline-block;
    padding: 3px 8px;
    border: 1px solid var(--hud-dim);
    border-radius: 4px;
    font-size: 10px;
    margin: 0 3px;
    font-family: var(--mono);
  }

  @media (max-width: 600px) {
    .controls { padding: 20px 24px 28px; gap: 14px; }
    .play-btn { width: 48px; height: 48px; }
    .icon { font-size: 64px; }
    .nav-btn { width: 38px; height: 38px; }
    .subtitle { max-width: 90%; }
    .now-playing { left: 16px; right: 16px; transform: translateY(-20px); }
    .now-playing.visible { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader"></div>
    <div class="loading-text">Loading Voice Narration</div>
  </div>

  <!-- Error Message -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Main Display -->
  <div class="display helios" id="display">
    <div class="icon" id="icon">☀️</div>
    <h1 class="title" id="title">Helios Tandem</h1>
    <p class="subtitle" id="subtitle">Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration.</p>
    <div class="voice-badge" id="voiceBadge">
      <span class="dot uk" id="voiceDot"></span>
      <span id="voiceLabel"><span class="voice-accent voice-uk-text">British RP</span> · jam</span>
    </div>
  </div>

  <!-- HUD Top -->
  <div class="hud-top">
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="badge" style="background:rgba(0,212,170,0.15);color:var(--accent);border-color:var(--accent);">SciCMP</span>
      <span class="badge" id="idBadge">P12</span>
      <span style="font-size:11px;color:var(--hud-dim);" id="counter">1 / 7</span>
    </div>
    <button class="status-btn" id="statusBtn" onclick="togglePlay()">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">PLAY</span>
    </button>
  </div>

  <!-- Navigation -->
  <div class="nav-left"><button class="nav-btn" onclick="prevClip()" aria-label="Previous clip">‹</button></div>
  <div class="nav-right"><button class="nav-btn" onclick="nextClip()" aria-label="Next clip">›</button></div>

  <!-- Clip Dots -->
  <div class="clip-dots" id="dots"></div>

  <!-- Now Playing Bar -->
  <div class="now-playing" id="nowPlaying">
    <div>
      <div class="np-label">Now Playing — Voice Narration</div>
      <div class="np-title" id="npTitle">Helios Tandem</div>
    </div>
    <div class="np-voice uk" id="npVoice">British RP</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="play-btn" id="mainPlayBtn" onclick="togglePlay()" aria-label="Play/Pause">
      <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
    </button>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar" onclick="seek(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>
  </div>

  <!-- Help Tip -->
  <div class="help-tip" id="helpTip">
    <kbd>←</kbd><kbd>→</kbd> Navigate &nbsp;|&nbsp; <kbd>Space</kbd> Play/Pause Voice
  </div>

</div>

<!-- Audio Element for Voice Narration Playback -->
<audio id="audioPlayer" preload="auto" crossorigin="anonymous"></audio>

<script>
// ============================================================
// RESEARCH CLIPS WITH NATIVE VOICE NARRATIONS
// Audio files contain REAL British RP and American voices
// ============================================================

const BASE = '/DemoSciCMP';

const clips = [
  {
    id: 'P12',
    name: 'Helios Tandem',
    desc: 'Advanced photovoltaic tandem cell architecture achieving record efficiency through novel materials integration.',
    icon: '☀️',
    bgClass: 'helios',
    voiceType: 'uk',
    voiceAccent: 'British RP',
    voiceArtist: 'jam',
    audio: `${BASE}/audio/portfolio-shorts/P12_jam.wav`
  },
  {
    id: 'P-AI',
    name: 'Lattice Forge',
    desc: 'AI-accelerated discovery of next-generation lattice materials for quantum computing applications.',
    icon: '🔬',
    bgClass: 'lattice',
    voiceType: 'us',
    voiceAccent: 'American Standard',
    voiceArtist: 'kazi',
    audio: `${BASE}/audio/portfolio-shorts/P-ai-materials_kazi.wav`
  },
  {
    id: 'P11',
    name: 'Carbon Sink',
    desc: 'Novel carbon capture methodology using bio-engineered microorganisms for industrial emissions reduction.',
    icon: '🌿',
    bgClass: 'carbon',
    voiceType: 'us',
    voiceAccent: 'American Natural',
    voiceArtist: 'douji',
    audio: `${BASE}/audio/portfolio-shorts/P11_douji.wav`
  },
  {
    id: 'P3',
    name: 'Solid State Labs',
    desc: 'Breakthrough in solid-state electrolyte conductivity enabling next-gen battery performance.',
    icon: '🔋',
    bgClass: 'solid',
    voiceType: 'us',
    voiceAccent: 'American Standard',
    voiceArtist: 'kazi',
    audio: `${BASE}/audio/portfolio-shorts/P3_kazi.wav`
  },
  {
    id: 'P5',
    name: 'Hydrogen Forge',
    desc: 'Green hydrogen production via photocatalytic water splitting at industrial scale feasibility.',
    icon: '💧',
    bgClass: 'hydrogen',
    voiceType: 'uk',
    voiceAccent: 'British RP',
    voiceArtist: 'jam',
    audio: `${BASE}/audio/portfolio-shorts/P5_jam.wav`
  },
  {
    id: 'P9',
    name: 'TMD Logic',
    desc: 'Transition metal dichalcogenide logic gates for post-silicon computing architectures.',
    icon: '💻',
    bgClass: 'tmd',
    voiceType: 'uk',
    voiceAccent: 'British RP',
    voiceArtist: 'jam',
    audio: `${BASE}/audio/portfolio-shorts/P9_jam.wav`
  },
  {
    id: 'P-CMOS',
    name: 'Atomic Gate Systems',
    desc: 'Sub-2nm CMOS transistor design overcoming quantum tunneling limitations.',
    icon: '⚛️',
    bgClass: 'atomic',
    voiceType: 'us',
    voiceAccent: 'American Standard',
    voiceArtist: 'kazi',
    audio: `${BASE}/audio/portfolio-shorts/P-cmos-2nm_kazi.wav`
  }
];

// ============================================================
// STATE
// ============================================================

let current = 0;
let isPlaying = false;
let progressInterval = null;

// DOM Elements
const audioPlayer = document.getElementById('audioPlayer');
const display = document.getElementById('display');
const mainPlayBtn = document.getElementById('mainPlayBtn');
const progressFill = document.getElementById('progressFill');
const loadingOverlay = document.getElementById('loadingOverlay');
const nowPlayingBar = document.getElementById('nowPlaying');

// ============================================================
// INITIALIZATION
// ============================================================

function init() {
  console.log('🎙️ SciCMP Portfolio Shorts — Voice Narration Player');
  console.log('📁 Audio base path:', BASE);
  console.log('🎬 Total clips:', clips.length);
  
  initDots();
  goToClip(0);
  
  // Hide loading after initial setup
  setTimeout(() => {
    loadingOverlay.classList.add('hidden');
  }, 800);
  
  // Show help tip briefly
  setTimeout(() => {
    document.getElementById('helpTip').classList.add('show');
  }, 1200);
  setTimeout(() => {
    document.getElementById('helpTip').classList.remove('show');
  }, 5000);
}

// ============================================================
// DOT NAVIGATION
// ============================================================

function initDots() {
  const container = document.getElementById('dots');
  container.innerHTML = '';
  clips.forEach((clip, i) => {
    const dot = document.createElement('button');
    dot.className = `clip-dot${i === 0 ? ' active' : ''}`;
    dot.title = `${clip.name} (${clip.voiceAccent})`;
    dot.onclick = () => goToClip(i);
    dot.setAttribute('aria-label', `Go to ${clip.name}`);
    container.appendChild(dot);
  });
}

// ============================================================
// CLIP NAVIGATION
// ============================================================

function goToClip(idx) {
  if (idx < 0 || idx >= clips.length) return;
  
  const wasPlaying = isPlaying;
  
  // Stop current audio
  stopAudio();
  
  // Fade out transition
  display.style.opacity = '0';
  
  setTimeout(() => {
    current = idx;
    const clip = clips[idx];
    
    // Update visual content
    updateDisplay(clip, idx);
    
    // Fade in
    display.style.opacity = '1';
    
    // Load and optionally play audio
    loadAudio(clip.audio, wasPlaying);
    
  }, 300);
}

function updateDisplay(clip, idx) {
  // Text content
  document.getElementById('icon').textContent = clip.icon;
  document.getElementById('title').textContent = clip.name;
  document.getElementById('subtitle').textContent = clip.desc;
  document.getElementById('idBadge').textContent = clip.id;
  document.getElementById('counter').textContent = `${idx + 1} / ${clips.length}`;
  
  // Voice badge with accent coloring
  const voiceDot = document.getElementById('voiceDot');
  voiceDot.className = `dot ${clip.voiceType}`;
  
  const voiceLabel = document.getElementById('voiceLabel');
  const accentClass = clip.voiceType === 'uk' ? 'voice-uk-text' : 'voice-us-text';
  voiceLabel.innerHTML = `<span class="voice-accent ${accentClass}">${clip.voiceAccent}</span> · ${clip.voiceArtist}`;
  
  // Background theme
  display.className = `display ${clip.bgClass}`;
  
  // Update dots
  document.querySelectorAll('.clip-dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });
  
  // Update now playing bar
  document.getElementById('npTitle').textContent = clip.name;
  const npVoice = document.getElementById('npVoice');
  npVoice.textContent = clip.voiceAccent;
  npVoice.className = `np-voice ${clip.voiceType}`;
}

function nextClip() { goToClip((current + 1) % clips.length); }
function prevClip() { goToClip((current - 1 + clips.length) % clips.length); }

// ============================================================
// AUDIO PLAYBACK
// ============================================================

function loadAudio(url, autoPlay = false) {
  console.log('🔊 Loading audio:', url);
  
  // Show brief loading state
  showLoading(true);
  
  // Reset progress
  progressFill.style.width = '0%';
  document.getElementById('curTime').textContent = '0:00';
  document.getElementById('durTime').textContent = '0:00';
  
  // Set new source
  audioPlayer.src = url;
  audioPlayer.load();
  
  audioPlayer.oncanplaythrough = () => {
    console.log('✅ Audio ready:', url);
    console.log('   Duration:', audioPlayer.duration, 'seconds');
    showLoading(false);
    document.getElementById('durTime').textContent = formatTime(audioPlayer.duration);
    
    if (autoPlay) {
      playAudio();
    }
  };
  
  audioPlayer.onerror = (e) => {
    console.error('❌ Audio load error:', e);
    console.error('   Code:', audioPlayer.error?.code);
    console.error('   Message:', audioPlayer.error?.message);
    showError(`Failed to load audio: ${audioPlayer.error?.message || 'Unknown error'}`);
    showLoading(false);
  };
}

function togglePlay() {
  if (!audioPlayer.src || audioPlayer.src === window.location.href) {
    showError('No audio loaded. Please select a clip.');
    return;
  }
  
  if (isPlaying) {
    pauseAudio();
  } else {
    playAudio();
  }
}

function playAudio() {
  const promise = audioPlayer.play();
  
  if (promise !== undefined) {
    promise.then(() => {
      console.log('▶️ Playing:', clips[current].name);
      setPlayingState(true);
    }).catch(err => {
      console.error('⚠️ Play prevented:', err.name, err.message);
      if (err.name === 'NotAllowedError') {
        showError('Click PLAY to enable audio playback');
      } else {
        showError(`Playback error: ${err.message}`);
      }
    });
  }
}

function pauseAudio() {
  audioPlayer.pause();
  setPlayingState(false);
  console.log('⏸ Paused');
}

function stopAudio() {
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  setPlayingState(false);
}

function setPlayingState(playing) {
  isPlaying = playing;
  
  // Update play button
  mainPlayBtn.classList.toggle('playing', playing);
  mainPlayBtn.innerHTML = playing
    ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
    : '<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>';
  
  // Update status button
  const statusDot = document.getElementById('statusDot');
  const statusLabel = document.getElementById('statusLabel');
  
  if (playing) {
    statusDot.classList.add('active');
    statusLabel.textContent = 'REC';
    document.getElementById('voiceDot').classList.add('playing');
    nowPlayingBar.classList.add('visible');
    startProgressTracking();
  } else {
    statusDot.classList.remove('active');
    statusLabel.textContent = 'PLAY';
    document.getElementById('voiceDot').classList.remove('playing');
    nowPlayingBar.classList.remove('visible');
    stopProgressTracking();
  }
}

// ============================================================
// PROGRESS TRACKING
// ============================================================

function startProgressTracking() {
  stopProgressTracking();
  progressInterval = setInterval(updateProgress, 100);
}

function stopProgressTracking() {
  if (progressInterval) {
    clearInterval(progressInterval);
    progressInterval = null;
  }
}

function updateProgress() {
  if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
    const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
    progressFill.style.width = `${pct}%`;
    document.getElementById('curTime').textContent = formatTime(audioPlayer.currentTime);
  }
}

function seek(e) {
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  
  if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
    audioPlayer.currentTime = pct * audioPlayer.duration;
    progressFill.style.width = `${pct * 100}%`;
  }
}

// ============================================================
// TIME FORMATTING
// ============================================================

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ============================================================
// UI HELPERS
// ============================================================

function showLoading(show) {
  if (show) {
    loadingOverlay.classList.remove('hidden');
  } else {
    loadingOverlay.classList.add('hidden');
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

// ============================================================
// KEYBOARD CONTROLS
// ============================================================

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      prevClip();
      break;
    case 'ArrowRight':
      e.preventDefault();
      nextClip();
      break;
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
  }
});

// ============================================================
// AUDIO EVENTS
// ============================================================

audioPlayer.addEventListener('ended', () => {
  console.log('🏁 Clip ended, advancing...');
  setPlayingState(false);
  setTimeout(nextClip, 800);
});

audioPlayer.addEventListener('timeupdate', () => {
  // Additional timeupdate handling if needed
});

// ============================================================
// START APPLICATION
// ============================================================

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
